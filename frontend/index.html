<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SmartFuel UZ - O'zbekiston Aqlli Yoqilg'i & EV Navigatsiya Platformasi</title>
  <meta name="description" content="O'zbekistondagi eng arzon AI-92, AI-95, barqaror yuqori bosimli metan (CNG), propan (LPG) va tezyurar EV quvvatlash stansiyalarini real-vaqtda toping." />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2300F2FE'><polygon points='13 2 3 14 12 14 11 22 21 10 12 10 13 2'/></svg>" />
  <link rel="stylesheet" href="./assets/css/main.css" />
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header class="app-header">
      <div class="brand-section">
        <div class="brand-logo-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="#0B0F19">
            <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
          </svg>
        </div>
        <div>
          <h1 class="brand-title">SmartFuel UZ</h1>
          <p class="brand-subtitle">Fuel & EV Smart Navigator</p>
        </div>
      </div>

      <!-- Live Stats Ticker -->
      <div class="live-ticker-bar">
        <div class="ticker-live-dot"></div>
        <div class="ticker-item">
          <span>O'rtacha Metan (CNG):</span>
          <b id="ticker-avg-pressure">204 bar</b>
        </div>
        <div class="ticker-item">
          <span>Eng arzon AI-92:</span>
          <b id="ticker-min-92">10 400 so'm</b>
        </div>
        <div class="ticker-item">
          <span>Bo'sh EV portlar:</span>
          <b id="ticker-ev-ports">12 / 18</b>
        </div>
      </div>

      <!-- Header Controls -->
      <div class="header-controls">
        <select id="city-select" class="custom-select" aria-label="Shahar tanlash">
          <option value="tashkent">Toshkent</option>
          <option value="samarkand">Samarqand</option>
          <option value="bukhara">Buxoro</option>
          <option value="fergana">Farg'ona</option>
          <option value="andijan">Andijon</option>
          <option value="namangan">Namangan</option>
        </select>

        <select id="lang-select" class="custom-select" aria-label="Til tanlash">
          <option value="uz">O'zbekcha</option>
          <option value="ru">Русский</option>
          <option value="en">English</option>
        </select>

        <a href="/admin.html" class="btn-header btn-admin" target="_blank">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
            <line x1="3" y1="9" x2="21" y2="9"/>
            <line x1="9" y1="21" x2="9" y2="9"/>
          </svg>
          Admin
        </a>

        <button id="user-auth-btn" class="btn-header btn-auth">Kirish</button>
      </div>
    </header>

    <!-- Main Workspace -->
    <main class="main-workspace">
      <!-- Fullscreen Map Container -->
      <div id="map-container"></div>

      <!-- Floating Top Search & Filters -->
      <div class="floating-top-bar">
        <div class="search-glass-wrapper">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#64748B" stroke-width="2.5">
            <circle cx="11" cy="11" r="8"/>
            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
          <input 
            type="text" 
            id="search-input" 
            placeholder="Zapravka nomi, manzil yoki brend (masalan: UNG Petro, TokBor)..." 
            autocomplete="off" 
          />
        </div>

        <div class="filters-pill-group">
          <button class="filter-chip active" data-filter="all">Barchasi</button>
          <button class="filter-chip" data-filter="cng">🟢 Metan (CNG)</button>
          <button class="filter-chip" data-filter="lpg">🟠 Propan (LPG)</button>
          <button class="filter-chip" data-filter="ai_92">⛽ AI-92</button>
          <button class="filter-chip" data-filter="ai_95">⛽ AI-95</button>
          <button class="filter-chip" data-filter="diesel">🛢️ Dizel</button>
          <button class="filter-chip" data-filter="ev">⚡ EV Quvvatlash</button>
          <button class="filter-chip" data-filter="open">✅ Ochiq</button>
        </div>
      </div>

      <!-- Smart Recommendation Best Option Card -->
      <div id="best-option-card" class="hidden"></div>

      <!-- Station Detail Side Drawer -->
      <aside id="station-detail-drawer" class="hidden">
        <div id="drawer-content"></div>
      </aside>
    </main>

    <!-- Report Modal -->
    <div id="report-modal" class="modal-overlay hidden">
      <div class="modal-card">
        <div class="modal-header">
          <h3>Xatolik haqida xabar berish</h3>
          <button class="modal-close-btn">✕</button>
        </div>
        <div class="modal-body">
          <p id="report-station-name" class="text-muted" style="margin-bottom: 12px;"></p>
          <form id="report-form">
            <input type="hidden" id="report-station-id" />
            <div class="form-group">
              <label>Muammo turi</label>
              <select id="report-type" class="custom-select">
                <option value="incorrect_price">Noto'g'ri narx</option>
                <option value="fuel_unavailable">Yoqilg'i tugagan</option>
                <option value="incorrect_pressure">Metan bosimi noto'g'ri ko'rsatilgan</option>
                <option value="charger_unavailable">EV zaryadlash stansiyasi ishlamayapti</option>
                <option value="station_closed">Zapravka yopiq</option>
                <option value="incorrect_location">Xaritada noto'g'ri joylashuv</option>
                <option value="other">Boshqa muammo</option>
              </select>
            </div>
            <div class="form-group">
              <label>Tavsif (ixtiyoriy)</label>
              <textarea id="report-desc" rows="3" placeholder="Muammoni qisqacha yozing..."></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Hisobotni yuborish</button>
          </form>
        </div>
      </div>
    </div>

    <!-- Review Modal -->
    <div id="review-modal" class="modal-overlay hidden">
      <div class="modal-card">
        <div class="modal-header">
          <h3>Sharh va baho qoldirish</h3>
          <button class="modal-close-btn">✕</button>
        </div>
        <div class="modal-body">
          <p id="review-station-name" class="text-muted" style="margin-bottom: 12px;"></p>
          <form id="review-form">
            <input type="hidden" id="review-station-id" />
            <div class="form-group">
              <label>Baho (1 dan 5 gacha)</label>
              <select id="review-rating" class="custom-select">
                <option value="5">⭐⭐⭐⭐⭐ A'lo (5.0)</option>
                <option value="4">⭐⭐⭐⭐ Yaxshi (4.0)</option>
                <option value="3">⭐⭐⭐ O'rtacha (3.0)</option>
                <option value="2">⭐⭐ Qoniqarsiz (2.0)</option>
                <option value="1">⭐ Yomon (1.0)</option>
              </select>
            </div>
            <div class="form-group">
              <label>Izoh</label>
              <textarea id="review-comment" rows="3" placeholder="Xizmat ko'rsatish, bosim yoki navbat haqida fikringiz..."></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Sharhni saqlash</button>
          </form>
        </div>
      </div>
    </div>

    <!-- Auth Modal -->
    <div id="auth-modal" class="modal-overlay hidden">
      <div class="modal-card">
        <div class="modal-header">
          <h3 id="auth-modal-title">Tizimga kirish</h3>
          <button class="modal-close-btn">✕</button>
        </div>
        <div class="modal-body">
          <form id="auth-form">
            <div class="form-group">
              <label>Email</label>
              <input type="email" id="auth-email" placeholder="admin@smartfuel.uz" required />
            </div>
            <div class="form-group">
              <label>Parol</label>
              <input type="password" id="auth-password" placeholder="Parolingiz..." required />
            </div>
            <button type="submit" class="btn btn-primary">Kirish</button>
          </form>
          <p style="font-size: 0.78rem; color: #94A3B8; margin-top: 14px;">
            Demo hisoblar:<br/>
            Admin: <code>admin@smartfuel.uz</code> / <code>admin123</code><br/>
            Foydalanuvchi: <code>user@smartfuel.uz</code> / <code>user123</code>
          </p>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="./assets/js/app.js"></script>
</body>
</html>
